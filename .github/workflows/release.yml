name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      skip_publish:
        description: "Skip publish (build only, no release created)"
        required: false
        default: "false"
        type: boolean
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          # nb4a.properties 含 SINGBOX_VERSION：只改它也必须使缓存失效，
          # 否则会命中缓存跳过 Native Build、发版静默带旧核心。
          # libcore 源码变动本身已由 libcore_status 覆盖
          #（git ls-files libcore 全量内容哈希）。
          # key 加 libcore- 前缀是为让下面的 restore-keys 能按前缀匹配。
          key: libcore-${{ hashFiles('golang_status', 'libcore_status', 'nb4a.properties') }}
          restore-keys: |
            libcore-
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          # 1.25 系最后一个补丁（2026-08-19 发布；1.25 线已 EOL，升 1.26/1.27 另议）
          go-version: '1.25.14'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x run && find buildScript libcore -name "*.sh" -exec chmod +x {} + && ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: libcore-${{ hashFiles('golang_status', 'libcore_status', 'nb4a.properties') }}
          restore-keys: |
            libcore-
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x run && find buildScript libcore -name "*.sh" -exec chmod +x {} + && ./run lib core
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-oss-
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          # 正式签名用 keystore 不进仓：由仓库 secret KEYSTORE_BASE64（base64 后的 release.keystore）
          # 在构建时恢复到仓库根目录；secret 为空时跳过，构建行为与原来一致。
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          chmod +x run gradlew && find buildScript libcore -name "*.sh" -exec chmod +x {} + && ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK_FILES=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' -type f)
          APK_COUNT=$(printf '%s\n' "$APK_FILES" | grep -c .)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "expected exactly 1 arm64-v8a APK, found $APK_COUNT: $APK_FILES" >&2
            exit 1
          fi
          echo "APK_DIR=$(dirname "$APK_FILES")" >> "$GITHUB_ENV"
      # 不再走 actions/upload-artifact：Actions 500MB 产物额度计数器卡住（2026-11-07 #24 在此步报
      # quota 已满而失败）。Release 页的包不占该额度，编完直接发版，与 preview.yml 同一做法。
      # publish 作业已并入本步（原 ghr 发版改为 gh release create，上传的仍是同一批 *.apk）。
      - name: Publish formal release
        if: github.event.inputs.skip_publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then echo "release tag is empty" >&2; exit 1; fi
          # delete 失败要区分：release 不存在可继续，真失败必须停下报错；
          # --cleanup-tag 保证旧 tag 不留在旧提交上，否则同一 tag 重触发时
          # 新包会挂在旧 tag 下。
          if ! DELETE_OUT=$(gh release delete "$TAG" -y --cleanup-tag 2>&1); then
            if printf '%s\n' "$DELETE_OUT" | grep -qiE 'not found|404'; then
              echo "No existing release $TAG; continuing."
            else
              printf '%s\n' "$DELETE_OUT" >&2
              echo "Failed to delete existing release $TAG; aborting." >&2
              exit 1
            fi
          fi
          gh release create "$TAG" --title "$TAG" "$APK_DIR"/*.apk || { echo "Failed to create release $TAG" >&2; exit 1; }
  # 2026-11-07：play 作业已删——它没有 KEYSTORE_BASE64 所以 bundlePlayRelease
  # 永远签不了名、一直失败（属预期，文件内原注释亦如此写），且 AAB 传包步早已
  # 删掉、没有任何作业下载 AAB，作业不产出任何人用的东西。
  # 随作业一并删掉的还有仅供它用的 workflow_dispatch 输入 play。

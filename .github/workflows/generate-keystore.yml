name: Generate Signing Keystore (one-time)
on:
  workflow_dispatch:
jobs:
  generate:
    name: Generate keystore on GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore and signing properties
        run: |
          set -e
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair \
            -keystore release.keystore \
            -storetype JKS \
            -alias rift \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Rift, O=Rift"
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=rift\nALIAS_PASS=%s\n' "$PASS" "$PASS" > local.properties
          base64 -w0 release.keystore > keystore.base64
          base64 -w0 local.properties > local-properties.base64
          # Passwords are NOT printed to logs. They live only in the
          # uploaded artifact below and in local.properties inside it.
          # After copying the two base64 values into repo secrets
          # (KEYSTORE_BASE64 and LOCAL_PROPERTIES), delete this artifact.
          # NOTE: This replaces the earlier PKCS12/RSA-4096 keystore, which
          # no shipped APK depends on (no APK has been published yet), so
          # changing the signing identity now loses nothing.
      - name: Upload signing material
        uses: actions/upload-artifact@v4
        with:
          name: signing-material
          path: |
            release.keystore
            local.properties
            keystore.base64
            local-properties.base64
          retention-days: 7
